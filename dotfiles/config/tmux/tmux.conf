# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Sane defaults
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g history-limit 100000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g set-clipboard on
set -g allow-passthrough on

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Splits in cwd, intuitive keys
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window switching
bind -n M-h previous-window
bind -n M-l next-window

# Vi copy mode
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Status bar — gruvbox-ish, minimal
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#1d2021,bg=#b8bb26,bold] #S #[fg=#b8bb26,bg=#1d2021] "
set -g status-right "#[fg=#928374]#(whoami)@#h #[fg=#fabd2f]%H:%M "
setw -g window-status-current-format "#[fg=#1d2021,bg=#fabd2f,bold] #I:#W "
setw -g window-status-format "#[fg=#a89984] #I:#W "
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
